name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies
        run: npm --prefix frontend ci
      - name: Frontend checks
        run: npm --prefix frontend test
      - name: Build embedded frontend
        run: make frontend
      - name: Script checks
        run: make test-scripts
      - name: Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
      - name: Go tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Bundle OpenWrt arm64
        run: make bundle-openwrt-arm64 VERSION=ci COMMIT="${GITHUB_SHA}" DATE="$(git show -s --format=%cI "${GITHUB_SHA}")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: boxctl-openwrt-linux-arm64-ci
          path: dist/boxctl-openwrt-linux-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shellcheck repository scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./

  main-artifacts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, packaging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies
        run: npm --prefix frontend ci
      - name: Derive next monthly CalVer
        id: version
        run: |
          calver=$(./scripts/calver.sh)
          printf 'calver=%s\n' "$calver" >> "$GITHUB_OUTPUT"
          printf 'build_date=%s\n' "$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Build Linux arm64 release artifacts
        env:
          CALVER: ${{ steps.version.outputs.calver }}
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
        run: |
          make bundle-openwrt-arm64 \
            OPENWRT_BUNDLE="dist/boxctl-openwrt-linux-arm64-$CALVER.tar.gz" \
            VERSION="$CALVER" COMMIT="$GITHUB_SHA" DATE="$BUILD_DATE"
          mv dist/boxctl-linux-arm64 "dist/boxctl-linux-arm64-$CALVER"
          file "dist/boxctl-linux-arm64-$CALVER" | grep -F 'ARM aarch64'
          file "dist/boxctl-linux-arm64-$CALVER" | grep -F 'statically linked'
          (cd dist && sha256sum "boxctl-linux-arm64-$CALVER" > "boxctl-linux-arm64-$CALVER.sha256")
          (cd dist && sha256sum "boxctl-openwrt-linux-arm64-$CALVER.tar.gz" > "boxctl-openwrt-linux-arm64-$CALVER.tar.gz.sha256")
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/openwrt-sdk/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          key: openwrt-sdk-25.12.5-mediatek-filogic-ff4a38a397caa2cf
      - name: Install OpenWrt SDK host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential gawk gettext git libncurses-dev python3 rsync unzip wget zstd
      - name: Build native OpenWrt 25.12 APK
        env:
          VERSION: ${{ steps.version.outputs.calver }}
        run: |
          BINARY="$PWD/dist/boxctl-linux-arm64-$VERSION" ./scripts/build-openwrt-apk.sh
      - name: Upload raw Linux arm64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: boxctl-linux-arm64
          path: |
            dist/boxctl-linux-arm64-${{ steps.version.outputs.calver }}
            dist/boxctl-linux-arm64-${{ steps.version.outputs.calver }}.sha256
            LICENSE
          if-no-files-found: error
          compression-level: 0
      - name: Upload portable OpenWrt bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: boxctl-openwrt-linux-arm64
          path: |
            dist/boxctl-openwrt-linux-arm64-${{ steps.version.outputs.calver }}.tar.gz
            dist/boxctl-openwrt-linux-arm64-${{ steps.version.outputs.calver }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Upload OpenWrt 25.12 mediatek/filogic APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: boxctl-openwrt-25.12-mediatek-filogic
          path: |
            dist/boxctl-openwrt-25.12-mediatek-filogic-${{ steps.version.outputs.calver }}.apk
            dist/boxctl-openwrt-25.12-mediatek-filogic-${{ steps.version.outputs.calver }}.apk.sha256
          if-no-files-found: error
          compression-level: 0
