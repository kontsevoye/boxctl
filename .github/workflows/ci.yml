name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: boxctl-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    outputs:
      calver: ${{ steps.version.outputs.calver }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies
        run: npm --prefix frontend ci
      - name: Frontend checks
        run: npm --prefix frontend test
      - name: Select build version
        id: version
        shell: bash
        run: |
          calver=ci
          tag=
          should_release=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/master ]]; then
            released_tag=
            while IFS= read -r candidate; do
              if ./scripts/validate-calver.sh "${candidate#v}" >/dev/null 2>&1; then
                released_tag=$candidate
                break
              fi
            done < <(git tag --points-at "$GITHUB_SHA" --list 'v*' --sort=-version:refname)

            if [[ -n "$released_tag" ]]; then
              calver=${released_tag#v}
              tag=$released_tag
            else
              calver=$(./scripts/calver.sh)
              ./scripts/validate-calver.sh "$calver"
              tag=v$calver
              should_release=true
            fi
          fi
          {
            printf 'calver=%s\n' "$calver"
            printf 'tag=%s\n' "$tag"
            printf 'should_release=%s\n' "$should_release"
            printf 'build_date=%s\n' "$(git show -s --format=%cI "$GITHUB_SHA")"
          } >> "$GITHUB_OUTPUT"
      - name: Build Linux arm64 artifacts
        if: github.event_name == 'pull_request' || steps.version.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.calver }}
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
          RELEASE_BUILD: ${{ steps.version.outputs.should_release }}
        run: |
          bundle=dist/boxctl-openwrt-linux-arm64.tar.gz
          if [[ "$RELEASE_BUILD" == true ]]; then
            bundle="dist/boxctl-openwrt-linux-arm64-$VERSION.tar.gz"
          fi
          make bundle-openwrt-arm64 \
            OPENWRT_BUNDLE="$bundle" \
            VERSION="$VERSION" COMMIT="$GITHUB_SHA" DATE="$BUILD_DATE"
          if [[ "$RELEASE_BUILD" == true ]]; then
            mv dist/boxctl-linux-arm64 "dist/boxctl-linux-arm64-$VERSION"
            file "dist/boxctl-linux-arm64-$VERSION" | grep -F 'ARM aarch64'
            file "dist/boxctl-linux-arm64-$VERSION" | grep -F 'statically linked'
            (cd dist && sha256sum "boxctl-linux-arm64-$VERSION" > "boxctl-linux-arm64-$VERSION.sha256")
            (cd dist && sha256sum "boxctl-openwrt-linux-arm64-$VERSION.tar.gz" > "boxctl-openwrt-linux-arm64-$VERSION.tar.gz.sha256")
          fi
      - name: Build embedded frontend for an already released commit
        if: github.event_name == 'push' && steps.version.outputs.should_release != 'true'
        run: make frontend
      - name: Script checks
        run: make test-scripts
      - name: Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
      - name: Go tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Shellcheck repository scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./
      - name: Upload pull-request bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: boxctl-openwrt-linux-arm64-ci
          path: dist/boxctl-openwrt-linux-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0
      - name: Cache OpenWrt SDK
        if: steps.version.outputs.should_release == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/openwrt-sdk/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          key: openwrt-sdk-25.12.5-mediatek-filogic-ff4a38a397caa2cf
      - name: Install OpenWrt SDK host prerequisites
        if: steps.version.outputs.should_release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential gawk gettext git libncurses-dev python3 rsync unzip wget zstd
      - name: Build native OpenWrt 25.12 APK
        if: steps.version.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.calver }}
        run: BINARY="$PWD/dist/boxctl-linux-arm64-$VERSION" ./scripts/build-openwrt-apk.sh
      - name: Upload release files
        if: steps.version.outputs.should_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: boxctl-release-${{ steps.version.outputs.tag }}
          path: |
            dist/boxctl-linux-arm64-${{ steps.version.outputs.calver }}
            dist/boxctl-linux-arm64-${{ steps.version.outputs.calver }}.sha256
            dist/boxctl-openwrt-linux-arm64-${{ steps.version.outputs.calver }}.tar.gz
            dist/boxctl-openwrt-linux-arm64-${{ steps.version.outputs.calver }}.tar.gz.sha256
            dist/boxctl-openwrt-25.12-mediatek-filogic-${{ steps.version.outputs.calver }}.apk
            dist/boxctl-openwrt-25.12-mediatek-filogic-${{ steps.version.outputs.calver }}.apk.sha256
            LICENSE
          if-no-files-found: error
          compression-level: 0

  release:
    if: needs.build.outputs.should_release == 'true'
    needs: build
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boxctl-release-${{ needs.build.outputs.tag }}
          path: release-files
      - name: Generate release notes from commits
        env:
          RELEASE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: ./scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > release-notes.md
      - name: Create CalVer tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.calver }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "release-files/dist/boxctl-linux-arm64-$VERSION" \
            "release-files/dist/boxctl-linux-arm64-$VERSION.sha256" \
            "release-files/dist/boxctl-openwrt-linux-arm64-$VERSION.tar.gz" \
            "release-files/dist/boxctl-openwrt-linux-arm64-$VERSION.tar.gz.sha256" \
            "release-files/dist/boxctl-openwrt-25.12-mediatek-filogic-$VERSION.apk" \
            "release-files/dist/boxctl-openwrt-25.12-mediatek-filogic-$VERSION.apk.sha256" \
            release-files/LICENSE \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --fail-on-no-commits
      - name: Record release
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: printf 'Published %s with raw binary, portable bundle, APK, SHA-256 files, and the MIT license.\n' "$TAG" >> "$GITHUB_STEP_SUMMARY"
